<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EVING — Lab for micro-apps</title>
<meta name="description" content="EVING Lab — a small studio for micro-apps.">
<meta name="theme-color" content="#0A0A0A">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ieving.com">
<meta property="og:title" content="EVING — Lab for micro-apps">
<meta property="og:description" content="A small lab for micro-apps.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="EVING — Lab for micro-apps">
<meta name="twitter:description" content="A small lab for micro-apps.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230A0A0A'/%3E%3Ctext x='50' y='66' font-family='system-ui' font-weight='900' font-size='56' fill='%23fff' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Syne:wght@600;800;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;
  --fg:#FFFFFF;
  --dim:rgba(255,255,255,0.45);
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(255,255,255,0.18);
  --ac:#C5FF3F;
  --sans:'Syne',system-ui,sans-serif;
  --logo:'Archivo Black','Syne',system-ui,sans-serif; /* EVING wordmark — matches the app (Y-3) */
  --mono:'DM Mono',ui-monospace,monospace;
}
/* Trademark mark on the EVING wordmark. */
.tm-mark{font-family:var(--mono);font-weight:400;font-size:0.4em;vertical-align:super;letter-spacing:0;margin-left:0.06em}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-weight:400;-webkit-font-smoothing:antialiased;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
body{min-height:100dvh;overflow-x:hidden;padding:max(env(safe-area-inset-top),24px) clamp(20px,5vw,64px) max(env(safe-area-inset-bottom),24px)}
a{color:inherit;text-decoration:none;transition:color .15s ease}
a:hover{color:var(--ac)}

.wrap{max-width:1280px;margin:0 auto}

/* ieving handwritten signature — white-on-transparent PNG (assets/ieving.png) */
.ieving-signature{display:block;height:auto}
.ieving-signature.in-header{width:auto;height:33px}
@media(min-width:768px){.ieving-signature.in-header{height:50px}}

/* Intro overlay — signature fades up on first visit, then slides up to reveal the header */
.intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;animation:intro-out .8s ease-in 2s forwards}
.intro .ieving-signature{width:min(60vw,420px);opacity:0;transform:translateY(8px);animation:sigIn 1.4s ease-out .3s forwards}
@keyframes sigIn{to{opacity:1;transform:translateY(0)}}
@keyframes intro-out{to{opacity:0;transform:translateY(-48px);visibility:hidden}}

/* Site header */
.site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 0;margin-bottom:clamp(48px,8vw,96px);border-bottom:1px solid var(--line);background:rgba(10,10,10,0.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.menu-trigger{font-family:var(--mono);font-size:14px;letter-spacing:0.18em;color:var(--fg);background:none;border:none;cursor:pointer;text-transform:uppercase;padding:4px 0}
.menu-trigger:hover{color:var(--ac)}

/* Menu overlay */
.menu-overlay{position:fixed;inset:0;z-index:90;background:rgba(10,10,10,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,8vw,80px) clamp(20px,5vw,64px);opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease}
.menu-overlay.open{opacity:1;visibility:visible}
.menu-close{position:absolute;top:max(env(safe-area-inset-top),24px);right:clamp(20px,5vw,64px);font-family:var(--mono);font-size:14px;letter-spacing:0.18em;background:none;border:none;color:var(--fg);cursor:pointer;text-transform:uppercase}
.menu-close:hover{color:var(--ac)}
.menu-nav{display:flex;flex-direction:column;max-width:1280px;margin:0 auto;width:100%}
.menu-nav .menu-link{align-self:flex-start;display:inline-flex;align-items:center;gap:14px;font-family:var(--sans);font-weight:800;font-size:clamp(20px,3.4vw,34px);letter-spacing:-0.02em;text-transform:uppercase;line-height:1;color:var(--fg);background:#121212;border:1px solid var(--line);border-radius:2px;padding:14px 26px;margin:6px 0;transition:border-color .25s ease,box-shadow .25s ease,transform .2s ease}
.menu-nav .menu-link:hover{color:var(--fg);border-color:rgba(197,255,63,0.45);box-shadow:0 0 28px rgba(197,255,63,0.07);transform:translateY(-2px)}
.menu-nav .menu-arrow{transition:transform .2s ease,color .2s ease;color:var(--dim);font-weight:400}
.menu-nav .menu-link:hover .menu-arrow{color:var(--ac);transform:translateX(6px)}
.menu-nav .menu-label{font-family:var(--mono);font-size:11px;letter-spacing:0.22em;color:var(--dim);text-transform:uppercase;padding:6px 0 4px}
.menu-nav .menu-sub{font-family:var(--sans);font-weight:600;font-size:clamp(16px,2.4vw,22px);letter-spacing:-0.01em;color:var(--fg);padding:4px 0 4px 18px}
.menu-nav .menu-sub span{color:var(--dim);font-family:var(--mono);font-weight:400;font-size:13px;letter-spacing:0.02em}
.menu-divider{height:1px;background:var(--line);border:none;margin:18px 0}
.menu-meta{font-family:var(--mono);font-size:11px;letter-spacing:0.22em;color:var(--dim);text-transform:uppercase;margin-top:8px}

/* Hero */
.hero{padding:clamp(40px,8vw,120px) 0 clamp(80px,12vw,160px);border-bottom:1px solid var(--line)}
.hero h1{font-family:var(--logo);font-weight:400;font-size:clamp(32px,5.5vw,84px);line-height:0.94;letter-spacing:-0.03em;text-transform:uppercase}
.hero h1 .nl{display:block}
.hero h1 .dot{color:var(--fg)}
.hero p{margin-top:clamp(24px,4vw,40px);max-width:540px;font-size:14px;line-height:1.6;color:var(--dim)}
.tagline{font-family:var(--sans);font-weight:800;font-size:clamp(22px,3.2vw,36px);line-height:1;letter-spacing:-0.02em;color:var(--fg);margin-top:clamp(28px,4vw,40px)}
.tagline .dot{color:var(--fg)}

/* Section heads */
.sec{padding:clamp(64px,10vw,140px) 0;border-bottom:1px solid var(--line)}
.sec-hdr{font-family:var(--mono);font-size:11px;letter-spacing:0.22em;color:var(--dim);text-transform:uppercase;margin-bottom:clamp(32px,5vw,56px)}

/* Product cards — two umbrella columns. Reuse the .tile look from the original Lab card. */
.product-cards{display:grid;grid-template-columns:1fr;gap:clamp(24px,4vw,40px);max-width:560px}
.card-column{display:flex;flex-direction:column}
.column-label{font-family:var(--mono);font-size:11px;letter-spacing:0.22em;color:var(--dim);text-transform:uppercase;margin-bottom:18px}
.product-cards .tile-title{font-size:clamp(28px,3.6vw,46px);margin-top:0;overflow-wrap:anywhere}
.tile-title .tt-mixed{text-transform:none}
.product-cards .tile{min-height:clamp(260px,32vw,360px)}

/* Lab: tile (original loved card — reused for the product cards) */
.tile{
  position:relative;
  display:block;
  border:1px solid var(--line);
  background:#121212;
  padding:clamp(28px,4vw,48px);
  min-height:clamp(280px,38vw,420px);
  transform-style:preserve-3d;
  transform:translateZ(0) rotateX(0) rotateY(0);
  transition:transform .35s cubic-bezier(.2,.8,.2,1), border-color .25s ease, box-shadow .35s ease, background-color .25s ease;
  overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04),
    0 12px 28px rgba(0,0,0,0.55),
    inset 0 1px 0 rgba(255,255,255,0.06);
}
/* Top accent bar (lime) — visible only on hover */
.tile::before{
  content:"";
  position:absolute;
  top:0;left:clamp(28px,4vw,48px);right:clamp(28px,4vw,48px);
  height:2px;
  background:linear-gradient(90deg, transparent, var(--ac), transparent);
  border-radius:0 0 4px 4px;
  opacity:0;
  transition:opacity .3s ease;
  pointer-events:none;
}
/* Diagonal lime ring — visible only on hover */
.tile::after{
  content:"";
  position:absolute;
  bottom:-60px;right:-60px;
  width:220px;height:220px;
  border:1px solid rgba(197,255,63,0.12);
  border-radius:50%;
  opacity:0;
  transition:opacity .35s ease, transform .5s ease;
  transform:scale(0.85);
  pointer-events:none;
}
.tile:hover, .tile.is-armed{
  border-color:rgba(197,255,63,0.35);
  color:var(--fg);
  transform:translateY(-3px) rotateX(1deg) rotateY(-1.5deg);
  box-shadow:
    0 0 0 1px rgba(197,255,63,0.08),
    0 20px 40px rgba(0,0,0,0.6),
    0 0 30px rgba(197,255,63,0.06),
    inset 0 1px 0 rgba(255,255,255,0.06);
}
.tile:hover::before, .tile.is-armed::before{opacity:0.7}
.tile:hover::after, .tile.is-armed::after{opacity:0.6;transform:scale(0.95)}
.tile:hover .tile-num, .tile.is-armed .tile-num{color:var(--ac)}
/* Touch devices: keep lime feedback, drop the 3D tilt (looks off without cursor parallax) */
@media (hover:none){
  .tile.is-armed{transform:translateY(-2px)}
}
.tile-num{font-family:var(--mono);font-size:11px;letter-spacing:0.22em;color:var(--dim)}
.tile-title{font-family:var(--logo);font-weight:400;font-size:clamp(40px,7vw,96px);line-height:0.95;letter-spacing:-0.02em;margin-top:24px;text-transform:uppercase}
.tile-title .dot{color:var(--ac)}
.tile-tag{font-family:var(--sans);font-weight:800;font-size:clamp(15px,1.8vw,19px);letter-spacing:-0.02em;line-height:1;color:var(--fg);margin-top:14px}
.tile-desc{font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--dim);max-width:420px;margin-top:20px}
.tile-platforms{font-family:var(--mono);font-size:12px;line-height:1.6;color:rgba(255,255,255,0.32);margin-top:14px;letter-spacing:0.02em}
.tile-foot{position:absolute;left:clamp(28px,4vw,48px);right:clamp(28px,4vw,48px);bottom:clamp(28px,4vw,48px);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:0.22em;text-transform:uppercase}
.live{color:var(--ac);display:inline-flex;align-items:center;gap:8px}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.arrow{transition:transform .2s ease}
.tile:hover .arrow{transform:translateX(6px);color:var(--ac)}

/* Manifesto — small centred mark. (Original .manifesto p rule kept below for the long-form variant.) */
.manifesto{font-family:var(--mono);font-size:14px;letter-spacing:0.22em;color:var(--dim);text-align:center;text-transform:lowercase;padding:clamp(56px,9vw,110px) 0}
.manifesto p{font-family:var(--sans);font-weight:600;font-size:clamp(22px,3.4vw,40px);line-height:1.25;letter-spacing:-0.01em;max-width:880px}
.manifesto p + p{margin-top:24px;color:var(--dim)}

/* Footer */
footer{padding:clamp(80px,12vw,140px) 0 8px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:0.18em;color:var(--dim);text-transform:uppercase}
footer a{color:var(--dim)}
footer a:hover{color:var(--ac)}

@media (max-width:640px){
  .tile-foot{position:static;margin-top:32px;left:auto;right:auto;bottom:auto}
}

/* ===== HOW IT WORKS — live one-phone demo (DROP + SPACE) ===== */
.how-head{max-width:560px;margin-bottom:clamp(36px,6vw,64px)}
.how-head h2{font-family:var(--sans);font-weight:800;font-size:clamp(26px,4.2vw,46px);line-height:1.04;letter-spacing:-0.02em}
.how-head h2 em{color:var(--fg);font-style:normal}
.how-head p{margin-top:16px;font-size:13px;line-height:1.6;color:var(--dim);max-width:440px}

.eving-demo{display:flex;flex-direction:column;align-items:center;gap:28px;font-family:var(--mono)}
.ed-phone{position:relative;width:300px;height:620px;border-radius:42px;
  background:linear-gradient(160deg,#1a1a1a,#0a0a0a);border:1px solid var(--line-strong);
  box-shadow:0 0 0 1px rgba(255,255,255,.03),0 40px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);padding:12px}
.ed-notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#000;border-radius:0 0 16px 16px;z-index:6}
.ed-screen{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;background:#0A0A0A;border:1px solid var(--line)}
.ed-bar{position:absolute;top:0;left:0;right:0;height:96px;z-index:4;padding:40px 18px 0;display:flex;flex-direction:column;gap:12px;background:linear-gradient(#0a0a0a,#0a0a0a 70%,transparent)}
.ed-bar-row{display:flex;align-items:center;justify-content:space-between}
.ed-logo{font-family:var(--logo);font-size:15px;letter-spacing:.02em}
.ed-logo .tm{font-family:var(--mono);font-weight:400;font-size:.42em;vertical-align:super;margin-left:.05em}
.ed-time{font-size:11px;color:var(--dim);letter-spacing:.05em}
.ed-tabs{display:flex;gap:22px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.ed-tab{position:relative;color:var(--dim);padding-bottom:6px;transition:color .4s}
.ed-tab.on{color:var(--fg)}
.ed-tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ac);border-radius:2px}
.ed-stage{position:absolute;top:96px;left:0;right:0;bottom:0}
.ed-scene{position:absolute;inset:0;opacity:0;transition:opacity .5s ease,transform .5s ease;display:flex;flex-direction:column;padding:18px;pointer-events:none}
.ed-scene.show{opacity:1}
.ed-drop{flex:1;border:1.5px dashed var(--line-strong);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--dim)}
.ed-drop .ed-arrow{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;animation:ed-bob 1.8s ease-in-out infinite}
@keyframes ed-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.ed-drop small{font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.ed-file{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:#141414;border:1px solid var(--line)}
.ed-file .ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;background:rgba(255,255,255,.08);color:var(--fg)}
.ed-file .meta{min-width:0}
.ed-file .nm{font-family:var(--sans);font-weight:700;font-size:14px;color:var(--fg)}
.ed-file .sz{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.04em}
.ed-drop-in{animation:ed-dropIn .55s cubic-bezier(.2,.9,.25,1.1)}
@keyframes ed-dropIn{from{opacity:0;transform:translateY(-26px) scale(.96)}to{opacity:1;transform:none}}
.ed-sheet{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:20px 20px 14px 14px;background:#101010;border:1px solid var(--line);transform:translateY(110%);transition:transform .5s cubic-bezier(.2,.9,.25,1.05)}
.ed-scene.show .ed-sheet{transform:none}
.ed-act{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:13px;font-size:13px;color:var(--fg);background:#171717;border:1px solid transparent}
.ed-act .ai{color:var(--dim);display:grid;place-items:center}
.ed-act.hot{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.06)}
.ed-act.hot .ai{color:var(--fg)}
.ed-send{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.ed-prog{width:170px;height:6px;border-radius:6px;background:#191919;overflow:hidden}
.ed-prog i{display:block;height:100%;width:0;background:var(--fg);border-radius:6px}
.ed-scene.show .ed-prog i{animation:ed-fill 1.1s ease forwards}
@keyframes ed-fill{to{width:100%}}
.ed-send small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.ed-check{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.10);color:var(--fg);opacity:0}
.ed-scene.show .ed-check{animation:ed-pop .4s ease .95s forwards}
@keyframes ed-pop{0%{opacity:0;transform:scale(.6)}60%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.ed-globe-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.ed-globe{position:relative;width:170px;height:170px}
.ed-earth{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:120px;height:120px;display:block;border-radius:50%;background:#050505}
.ed-orbit{position:absolute;inset:0;animation:ed-spin 7s linear infinite}
.ed-dot{position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--fg);box-shadow:0 0 10px rgba(255,255,255,.7)}
.ed-orbit.b{animation-duration:5s;animation-direction:reverse}
.ed-orbit.b .ed-dot{background:var(--dim);box-shadow:0 0 8px rgba(255,255,255,.3)}
@keyframes ed-spin{to{transform:rotate(360deg)}}
.ed-globe-wrap b{font-family:var(--sans);font-weight:800;font-size:15px}
.ed-globe-wrap small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.ed-cap{display:flex;flex-direction:column;align-items:center;gap:14px}
.ed-cap-text{font-family:var(--sans);font-weight:800;font-size:clamp(18px,4.5vw,24px);letter-spacing:-.01em;min-height:30px;text-align:center;transition:opacity .35s}
.ed-cap-text em{color:var(--fg);font-style:normal}
.ed-steps{display:flex;gap:8px}
.ed-steps span{width:7px;height:7px;border-radius:50%;background:var(--line-strong);transition:all .4s}
.ed-steps span.on{background:var(--fg);width:22px;border-radius:4px}
@media (prefers-reduced-motion:reduce){
  .ed-arrow,.ed-orbit,.ed-globe .ring{animation:none}
}
</style>
</head>
<body>

<div class="menu-overlay" id="menu" aria-hidden="true">
  <button class="menu-close" aria-label="Close menu">Close ✕</button>
  <nav class="menu-nav">
    <a class="menu-link" href="/">Home <span class="menu-arrow">→</span></a>
    <hr class="menu-divider">
    <div class="menu-label">Products</div>
    <a class="menu-sub" href="https://app.eving.app"><span translate="no">EVING</span> Drop <span>· for your daily life</span></a>
    <hr class="menu-divider">
    <a class="menu-link" href="#about">About <span class="menu-arrow">→</span></a>
    <a class="menu-link" href="mailto:ev@ieving.com">Contact <span class="menu-arrow">→</span></a>
    <hr class="menu-divider">
    <div class="menu-meta">Legal · Privacy</div>
  </nav>
</div>

<div class="wrap">

  <header class="site-header">
    <a href="/" class="site-brand" aria-label="ieving — home"><img class="ieving-signature in-header" src="/assets/ieving.png" alt="ieving" width="420" height="276"></a>
    <nav class="site-menu">
      <button class="menu-trigger" aria-haspopup="true" aria-controls="menu">Menu</button>
    </nav>
  </header>

  <section class="hero">
    <h1 translate="no">Eving<span class="tm-mark">™</span> Lab<span class="dot">.</span></h1>
  </section>

  <section class="sec" id="products">
    <div class="product-cards">
      <div class="card-column">
        <div class="column-label">For your daily life</div>
        <a class="tile" href="https://app.eving.app" target="_blank" rel="noopener">
          <div class="tile-title"><span translate="no">EVING</span><span class="tm-mark">™</span> <span class="tt-mixed">Drop</span></div>
          <div class="tile-desc">Drop it.<br>Catch it.</div>
          <div class="tile-tag">Ping different.</div>
          <div class="tile-foot">
            <span class="live">Live</span>
            <span class="arrow">Try it →</span>
          </div>
        </a>
      </div>
    </div>
  </section>


  <div class="manifesto"><span translate="no">eving</span> lab</div>

  <footer>
    <div><a href="mailto:ev@ieving.com">ev@ieving.com</a></div>
  </footer>

</div>

<script>
  // Intro pen-signature: play once per session, skippable.
  (function(){
    var body = document.body;
    var intro = document.querySelector('.intro');
    if (!intro) return;
    if (sessionStorage.getItem('intro-shown')) {
      intro.remove();
    } else {
      sessionStorage.setItem('intro-shown', 'true');
      intro.addEventListener('animationend', function(e){
        if (e.animationName === 'intro-out') intro.remove();
      });
      var skip = function(){ if (intro && intro.parentNode) intro.remove(); };
      ['click','touchstart','keydown'].forEach(function(ev){
        document.addEventListener(ev, skip, { once:true });
      });
    }
  })();

  // Menu overlay.
  (function(){
    var trigger = document.querySelector('.menu-trigger');
    var overlay = document.getElementById('menu');
    var closeBtn = overlay && overlay.querySelector('.menu-close');
    if (!trigger || !overlay) return;
    var open = function(){ overlay.classList.add('open'); body.style.overflow = 'hidden'; };
    var close = function(){ overlay.classList.remove('open'); document.body.style.overflow = ''; };
    var body = document.body;
    trigger.addEventListener('click', open);
    if (closeBtn) closeBtn.addEventListener('click', close);
    overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
    document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
    overlay.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', close); });
  })();

  // Touch devices: first tap arms (lime preview), second tap opens link.
  if (window.matchMedia && window.matchMedia('(hover: none)').matches) {
    document.querySelectorAll('.tile').forEach(function(tile){
      tile.addEventListener('click', function(e){
        if (!tile.classList.contains('is-armed')) {
          e.preventDefault();
          document.querySelectorAll('.tile.is-armed').forEach(function(t){ t.classList.remove('is-armed'); });
          tile.classList.add('is-armed');
        }
      });
    });
    document.addEventListener('click', function(e){
      if (!e.target.closest('.tile')) {
        document.querySelectorAll('.tile.is-armed').forEach(function(t){ t.classList.remove('is-armed'); });
      }
    }, true);
  }

</script>
</body>
</html>
